<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>

    <form>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile" required><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="gender">Gender:</label><br>
        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <label for="course">Course:</label><br>

        <select value="course">
            <option>Select Course</option>
            <option>Python Full Stack</option>
            <option>Java Full Stack</option>
            <option>Data Science</option>
            <option>UI/UX Design</option>
        </select>
        <br><br>

        <label for="hobbies">Hobbies:</label><br>

        <input type="checkbox" id="reading" name="hobby">
        <label for="reading">Reading</label><br>

        <input type="checkbox" id="sports" name="hobby">
        <label for="sports">Sports</label><br>

        <input type="checkbox" id="music" name="hobby">
        <label for="music">Music</label><br>

        <input type="checkbox" id="travel" name="hobby">
        <label for="travel">Travel</label><br><br>

        <label for="address">Address:</label><br>

        <textarea id="address" name="address" rows="4" cols="30"></textarea><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <button type="submit">Submit</button>

        <button type="reset">Reset</button>
    </form>
</body>
</html>
