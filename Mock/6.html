<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
</head>
<body>
    <header>
        <h1>Job Application Form</h1>
    </header>

    <hr>

    <form>

        <label for="name">Applicant Name:</label><br>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email"><br><br>

        <label for="mobile">Mobile Number:</label><br>
        <input type="tel" id="mobile" name="mobile"><br><br>

        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob"><br><br>

        <label>Gender:</label><br>

        <input type="radio" id="male" name="gender" value="Male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <label for="qualification">Qualification:</label><br>

        <select id="qualification" name="qualification">
            <option>Select Qualification</option>
            <option>Diploma</option>
            <option>B.Sc</option>
            <option>BCA</option>
            <option>B.E / B.Tech</option>
            <option>MCA</option>
            <option>M.Tech</option>
        </select>

        <br><br>

        <label for="experience">Experience:</label><br>

        <select id="experience" name="experience">
            <option>Fresher</option>
            <option>1 Year</option>
            <option>2 Years</option>
            <option>3 Years</option>
            <option>5+ Years</option>
        </select>

        <br><br>

        <label>Skills:</label><br>

        <input type="checkbox" id="html" name="skills">
        <label for="html">HTML</label><br>

        <input type="checkbox" id="css" name="skills">
        <label for="css">CSS</label><br>

        <input type="checkbox" id="javascript" name="skills">
        <label for="javascript">JavaScript</label><br>

        <input type="checkbox" id="python" name="skills">
        <label for="python">Python</label><br>

        <input type="checkbox" id="sql" name="skills">
        <label for="sql">SQL</label>

        <br><br>

        <label for="resume">Upload Resume:</label><br>
        <input type="file" id="resume" name="resume"><br><br>

        <label for="location">Preferred Location:</label><br>

        <select id="location" name="location">
            <option>Chennai</option>
            <option>Bangalore</option>
            <option>Hyderabad</option>
            <option>Pune</option>
            <option>Mumbai</option>
            <option>Remote</option>
        </select>

        <br><br>

        <button type="submit">Submit Application</button>

    </form>

    <hr>

    <footer>
        <p>&copy; 2026 Job Portal. All Rights Reserved.</p>
    </footer>

</body>
</html>
