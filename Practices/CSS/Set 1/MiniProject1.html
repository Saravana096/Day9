<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Button Style Showcase</title>
    <!--External CSS-->
    <link rel="stylesheet" href="style.css">
    <style>
        <!--Internal CSS-->
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: rgb(185, 180, 180);
            text-align: center;
            margin-top: 80px;
        }

        h1 {
            color: #1e2523;
            font-size: 33px;
            text-align: center;
            margin-bottom: 40px;
        }

        .internal-btn {
            background-color: brown;
            color: white;
            margin: 15px;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .internal-btn:hover {
            background-color: #1e2523;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <h1>Button Type Showcase</h1>

    <!--Inline CSS Button-->

    <button style="background-color: dodgerblue; font-size: 18px; border-radius: 8px; border: none; color: white;  
    padding: 15px 30px; margin: 15px; cursor: pointer;">
    Inline CSS Button
    </button>

    <!--Internal CSS Button-->

    <button class="internal-btn">Internal CSS Button</button>

    <!--External CSS Button-->

    <button class="external-btn">External CSS Button</button>
</body>
</html>
