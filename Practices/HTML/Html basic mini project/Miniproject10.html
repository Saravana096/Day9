<body>
    <h1>RSVP Forms</h1>
    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
