<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project 8</title>
</head>
<body>
    <h1>Multimedia Gallery</h1>

    <figure>
        <img src="https://picsum.photos/seed/picsum/300/300" alt="Mountain Picture">

            Beautiful Mountain Images
        </figcaption>
    </figure>

    <figure>
        <video width="400" controls>

        <figcaption>Sample Video</figcaption>

    <figure>
        <audio controls>
            <source src="/Practices/HTML/handon 1/audio.mp3" type="audio/mpeg">
            Your browser does not support the audio tag.
        </audio>

        <figcaption>Sample Audio</figcaption>
    </figure>
