<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <header>
    <h1>Welcome to my Website</h1>

    <p>In this website you can learn HTML, CSS, JavaScript, Python programming language.</p>
    </header>
    <main>

    <svg width="300" height="220">
        <circle cx="150" cy="60" r="30" fill="skyblue">

                <animate 
                        attributeName="r" 
                        values="30;40;30" 
                        dur="2s" 
                        repeatCount="indefinite"/>

        </circle>

        <rect x="120" y="100" width="60" height="60" fill="black">
            <animate attributeName="fill" values="orange;red;orange" dur="2s" repeatcount="indefinite"/>
        </rect>

        <text x="90" y="200" font-size="24" fill="black"> My LOGO
            <animate attributeName="fill" values="black;yellow;red" dur="2s" repeatcount="indefinite"/>
        </text>
    </svg>
    </main>

    <footer>
        <small>&copy;2026 All rights reserved.</small>
    </footer>
</body>
</html>
