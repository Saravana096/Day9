<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Accessible Survey Form</h1>

    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" 
        aria-label="Enter your Full name" pattern="[A-Za-z ]{3,30}" required><br><br>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" aria-label="Enter your Age" min="1" max="120" required><br><br>

        <label for="favorite">Pick a Color:</label>
        <input type="color" id="favorite" name="favorite" aria-label="Choose a color" required><br><br>

        <button type="submit" aria-label="submit the form">Submit</button>
        <button type="reset" aria-label="clear the form">Clear</button>
    </form>
</body>
</html>
