<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Post</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            background-color: #111827;
            text-align: center;
        }
        header{
            background-color: #1F2937;
            color: #FACC15;
        }
        header h1 {
            font-size: 45px;
            background-color: #1F2937;
        }

        header h2 {
            font-size: 30px;
            color: #FACC15;
            background-color: #1F2937;
        }
        
        h2 + p{
            background-color: #E5E7EB;
            color: #334155;
            font-size: 20px;
        }

        article {
            background-color: white;
        }

        article > h2 {
            color: #2563EB;
        }

        article > ul {
            color: #306D29;
            display: inline-block;
            float: none;
        }

        fieldset {
            float: left;
            color: white;
            background-color:black;
        }

        fieldset > textarea {
            background-color:black;
            color: white;
        }

        textarea:hover {
            color: aqua;
        }

        footer {
            clear: both;
            color: white;
            background-color: #1F2937;
            text-align: left;

        }
    </style>
</head>
<body>
    <!--7. Blog Post with Comments
Requirements:
 Article section (<article>)
 Text formatting (<small>, <del>, <ins>)
 Textarea for comments (<textarea>)
 Fieldset (<fieldset>) for comment section-->

    <header>
        <h1>My First Blog</h1>

        <h2>About Me</h2>

        <p><strong>I Am Saravanakumar</strong>I love <del>traveling</del> to explore the world. My Aims is to become a <ins>millionarie with 5 Years</ins></p>
    </header>

    <main>
        <article>
            <h2>My Hobbies</h2>

            <ul>
                <li>Become Youtuber</li>
                <li>Editing Videos</li>
                <li>Doing Freelancing</li>
                <li>Become Python Full Stack Developer</li>
            </ul>
        </article>

        <fieldset>
            <legend>Leave a Message</legend>
            <textarea rows="5" cols="50" placeholder="Enter your Message here"></textarea>
        </fieldset>
    </main>

    <footer>
        
        <small>&copy;2026 Saravanakumar V</small>
    
    </footer>
</body>
</html>
