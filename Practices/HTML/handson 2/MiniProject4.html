<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Comparison</title>
</head>
<body>
    <!--4. Product Comparison Table
Requirements:
 Table (<table>, <tr>, <th>, <td>)
 Use colspan or rowspan
 Table header (<thead>) and body (<tbody>)
 Border attribute (border="1")-->

    <h1>Product Comparison Table</h1>

    <table border="5">

        <thead>
            <tr>
                <th colspan="3">Product Compare</th>
            </tr>
        
            <tr>
                <th>Features</th>
                <th>Laptop A</th>
                <th>Laptop B</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Processor</td>
                <td>Intel Core i5</td>
                <td>Intel Core i7</td>
            </tr>

            <tr>
                <td>RAM</td>
                <td>4 GB</td>
                <td>16 GB</td>
            </tr>

            <tr>
                <td>Storage</td>
                <td>512 GB</td>
                <td>1TB</td>
            </tr>

            <tr>
                <td>Price</td>
                <td>55000</td>
                <td>65000</td>
            </tr>
        </tbody>


    </table>
</body>
</html>
