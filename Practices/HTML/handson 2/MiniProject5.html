<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
</head>
<body>
    <!--5. Survey Form
Requirements:
 Form with action and method
 Text input (<input type="text">)
 Radio buttons (<input type="radio">)
 Checkboxes (<input type="checkbox">)
 Submit button (<input type="submit">)-->

    <h1>Survey Form</h1>

    <form action="/submit" method="post">

        
        <label for="name">Name:</label>
        <input type="text" id="name" name="name"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address"><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone"><br><br>

        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="male">
        <label for="male">Male</label>

        <input type="radio" id="female" name="female">
        <label for="female">Female</label><br><br>

        <p>How you rate us?</p>
        <input type="radio" id="rating1" name="rating1">
        <label for="rating1">1</label><br>

        <input type="radio" id="rating2" name="rating2">
        <label for="rating2">2</label><br>

        <input type="radio" id="rating3" name="rating3">
        <label for="rating3">3</label><br>

        <input type="radio" id="rating4" name="rating4">
        <label for="rating4">4</label><br>
        
        <input type="radio" id="rating5" name="rating5">
        <label for="rating5">5</label><br>

        <p>Which Service you like from us?</p>
        <input type="checkbox" id="html" name="html">
        <label for="html">HTML</label><br>

        <input type="checkbox" id="web" name="service" value="Web Development">
        <label for="web development">Web Development</label><br>

        <input type="checkbox" id="mobile" name="service" value="Mobile App">
        <label for="mobile">Mobile App</label><br>

        <input type="checkbox" id="cloud" name="service" value="Cloud Service">
        <label for="cloud">Cloud Service</label><br><br>

        <button type="submit">Submit</button>

    
    </form>

</body>
</html>
