<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #0B0909;
            text-align: center;
        }

        header {
            background-color: #06202B;
        }

        h1 {
            color: #FDEB9E;
            font-size: 40px;
        }

        p {
            color: #D3D4C0;
            font-size: 30px;
        }

        label {
            display: inline-block;
            width: 130px;
            text-align: right;
        }

        .login-form {
            background-color: #D0E7E6;
            font-size: 16px;
        }

        button {
            background-color: black;
            color: white;
        }

        input:focus {
            background-color: #DDDDDD;
        }

        button:hover {
            background-color: #333D6D;
        }

        select:focus {
            background-color: #DDDDDD;
        }

        footer {
            background-color: #A5CF83;
        }

        footer > small {
            color: black;
            
        }
        footer a {
            color: black;
        }

        a:hover {
            color: blue;
        }
    </style>
</head>
<body>
    <!--6. Registration Form
Requirements:
 Email input (<input type="email">)
 Password field (<input type="password">)
 Number input (<input type="number">)
 Date picker (<input type="date">)
 Dropdown (<select> with <option>)-->
    <header>

    <h1>Registration Form</h1>

    <p>Please Register your details in below!</p>

    </header>

    <main>

    <section class="login-form">

    <form>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password"><br><br>

        <label for="age">Age:</label>
        <input type="number" id="age" name="age"><br><br>

        <label for="dob">Date of Brith:</label>
        <input type="date" id="dob" name="dob"><br><br>

        <label for="course">Choose a Course:</label>
        <select id="course" name="course">
            <option>---Select a Course---</option>
            <option>Web Developer</option>
            <option>Python Developer</option>
            <option>UI/UX Designer</option>
            <option>Software Developer</option>
        </select><br><br>

        <button type="submit">Register</button>

        <br><br>

    </form>

    </section>

    </main>

    <footer>
        <small>&copy;2026 Saravanakumar V <a href="s2nkumar.crazy@gmail.com">s2nkumar.crazy@gmail.com</a>.</small>
    </footer>
</body>
</html>
