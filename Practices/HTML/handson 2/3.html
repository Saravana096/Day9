<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:linear-gradient(to top,#FFFFC7,#473335);
            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            width:350px;
            padding:20px;
            border:2px solid black;
            border-radius:10px;
            background:white;
        }

        h1{
            text-align:center;
            color:#0E402D;
            margin-bottom:20px;
        }

        form{
            background:radial-gradient(at top,#C0D6DF,#000000);
            padding:20px;
            border-radius:10px;
        }

        label{
            color:white;
            display:block;
            margin-bottom:5px;
        }

        input{
            width:100%;
            padding:8px;
            margin-bottom:15px;
            border:none;
            border-radius:5px;
            background:#eac48b;
        }

        button{
            width:100%;
            padding:10px;
            font-size:16px;
            font-weight:bold;
            border:none;
            border-radius:5px;
            cursor:pointer;
            color:#241909;
            background:conic-gradient(#52B2CF,#9CADCE);
        }

        button:hover{
            background:conic-gradient(#42213D,#548687,#C2C1C2);
        }

        footer{
            text-align:center;
            margin-top:20px;
            color:#333;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>Login Form</h1>

        <form>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Enter Email">

            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter Password">

            <button type="submit">Login</button>

        </form>

        <footer>
            <small>&copy; 2026 Saravanakumar V</small>
        </footer>

    </div>

</body>
</html>
