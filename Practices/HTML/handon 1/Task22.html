<!DOCTYPE html>

<body>
    <!--Build a table for monthly expenses. Add a total row at the bottom using 
    <tfoot>. Use <thead> and <tbody> for structure.-->

    <h1>Monthly Expenses</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Expenses</th>
                <th>Amount</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Rice</td>
                <td>100</td>
            </tr>

            <tr>
                <td>Oil</td>
                <td>200</td>
            </tr>

            <tr>
                <td>Rent</td>
                <td>7000</td>
            </tr>

            <tr>
                <td>Broadband</td>
                <td>900</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>Total</th>
                <th>8200</th>
            </tr>
        </tfoot>
    </table>

    <h1>Salary Expenses</h1>

    <table border="1">
        <thead>
            <tr>
                <th>Credited</th>
                <th>Debited</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td rowspan="5">35021</td>
                <td>12000</td>
            </tr>

            <tr>
                <td>7500</td>
            </tr>

            <tr>
                <td>919.09</td>
            </tr>

            <tr>
                <td>2000</td>
            </tr>

            <tr>
                <td>3000</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <th>Total</th>
                <th>25,419.09</th>
            </tr>
        </tfoot>
    </table>

    
</body>
</html>
