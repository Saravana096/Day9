<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 34</title>
</head>
<body>
    <!--Build a custom color selector using <input type="color"> and display the 
    selected color as text beside it.-->

    <h1>Custom Color Selector</h1>

    <form>
        <label for="color">Pick a Color</label><br>
        <input type="color" id="color" name="color" value="#ff0000"><br><br>
        <span>Selected Color #ff0000</span>
    </form>
</body>
</html>
