<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comment Section</title>
</head>
<body>
    <!--.Build a comment section where users can type multi-line messages using
<textarea>. Show a character limit hint using maxlength.-->

    <form>
        <h1>Comment Section</h1>

        <label for="comment">Comment:</label><br>
        <textarea id="comment" name="comment" rows="5" cols="50" maxlength="200" placeholder="Enter your comment"></textarea><br>

        <small>200 Maximum character allowed</small><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
