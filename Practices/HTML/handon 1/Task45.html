<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!--Build a user settings form with different validations: email check, number 
    range (1–10), and pattern match for ZIP code.-->

    <h1>User Settings Form</h1>

    <form>
        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>

        <label for="experience">Experience Level:</label><br>
        <input type="number" id="experience" name="experience" min="1" max="10" placeholder="Enter a number between 1 and 10" required><br><br>

        <label for="zipcode">Zipcode:</label><br>
        <input type="text" id="zipcode" name="zipcode" pattern="[0-9]{6}" placeholder="Example: 600001" title="Enter a 6-digit ZIP code" required><br><br>

        <button type="submit">Save Settings</button>


    </form>

    <hr>

    

</body>
</html>
