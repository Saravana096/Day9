<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <!--Design a contact form with Name, Phone (number type), Email, and 
    Message (<textarea>). Submit using a button.-->

    <h1>Contact Form</h1>

    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="phone">Phone:</label><br>
        <input type="number" id="phone" name="phone" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="message">Message</label><br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br>
         

        <button type="submit">Submit</button>
    </form>

    <hr>

    <h1>GYM Form</h1>
    <form>
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone:</label><br>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" required><br><br>

        <label for="age">Age</label><br>
        <input type="number" id="age" name="age" min="18" max="100"><br><br>

        <label for="message">Message</label><br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea><br><br><br>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
