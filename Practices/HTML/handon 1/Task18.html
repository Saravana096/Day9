<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 18</title>
</head>
<body>
    <!--Build an HTML page that embeds a video and an audio clip using <video> 
    and <audio>. Add controls and fallback messages.-->
    
    <h1>Video and Audio</h1>

    <h2>Video</h2>

    <video width="400" controls>
        <source src="video.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <h2>Audio</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
        Your browser does not support the video tag.
    </audio>
    <hr>
</body>
</html>
