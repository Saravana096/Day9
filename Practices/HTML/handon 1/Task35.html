<!DOCTYPE html>
<html lang="en">

<body>
    <!--Design a simple poll system using radio buttons. Include a submit button 
    and a message showing "Thank you" after submission-->

    <h1>Simple Poll</h1>
    <form>
        <p>Which is your faviourt Programming language?</p>

        <input type="radio" id="html" name="language" value="HTML">
        <label for="html">HTML</label><br><br>

        <input type="radio" id="css" name="language" value="CSS">
        <label for="css">CSS</label><br><br>

        <input type="radio" id="javascript" name="language" value="Javascript">
        <label for="javascript">Javascript</label><br><br>

        <button type="submit">Submit</button>
        
    </form>
</body>
</html>
