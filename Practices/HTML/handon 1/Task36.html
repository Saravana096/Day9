<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Country</title>
</head>
<body>
    <!--Create a form with a dropdown to choose a country. On selection, show a 
    message like “You selected UK!” (with basic JS if needed).-->

    <form>
        <label for="country">Choose a Country:</label><br>

        <select id="country" onchange="showMessage()">
            <option value="">Select a Country</option>
            <option>India</option>
            <option>US</option>
            <option>UK</option>
            <option>Canada</option>
        </select>
    </form>

    <p id="message"></p>

    <script>
        function showMessage() {
        let country = document.getElementById("country").value;
        document.getElementById("message").textContent = 
        country ? " You selected " + country + "!" : "";
        }
    </script>
</body>
</html>
