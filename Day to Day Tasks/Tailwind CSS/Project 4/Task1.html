<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Simple Navbar</title>

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="./dist/output.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="bg-gray-100">

    <!-- Navbar -->
    <nav class="bg-primary px-4 py-4 sm:px-8 md:px-12">

        <div
            class="max-w-7xl mx-auto
                   flex flex-col
                   sm:flex-row
                   sm:items-center
                   sm:justify-between
                   gap-4">

            <!-- Logo -->
            <h1
                class="text-white
                       text-2xl
                       md:text-3xl
                       font-bold
                       font-profile
                       text-center
                       sm:text-left">

                MyWebsite

            </h1>

            <!-- Navigation Links -->
            <div
                class="flex
                       justify-center
                       items-center
                       gap-4
                       sm:gap-6
                       md:gap-8">

                <a
                    href="#"
                    class="text-white
                           text-sm
                           md:text-base
                           font-medium
                           hover:text-yellow-300
                           transition
                           duration-300">

                    Home

                </a>

                <a
                    href="#"
                    class="text-white
                           text-sm
                           md:text-base
                           font-medium
                           hover:text-yellow-300
                           transition
                           duration-300">

                    About

                </a>

                <a
                    href="#"
                    class="text-white
                           text-sm
                           md:text-base
                           font-medium
                           hover:text-yellow-300
                           transition
                           duration-300">

                    Services

                </a>

                <a
                    href="#"
                    class="text-white
                           text-sm
                           md:text-base
                           font-medium
                           hover:text-yellow-300
                           transition
                           duration-300">

                    Contact

                </a>

            </div>

        </div>

    </nav>


    <!-- Content -->
    <main class="text-center p-8">

        <h2
            class="text-2xl
                   md:text-4xl
                   font-bold
                   text-gray-800">

            Welcome to My Website

        </h2>

        <p class="mt-3 text-gray-600">
            Simple Tailwind CSS Navbar
        </p>

    </main>

</body>

</html>
