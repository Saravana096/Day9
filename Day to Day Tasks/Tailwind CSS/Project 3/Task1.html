<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Product Card</title>

    <link rel="stylesheet" href="./dist/output.css">
</head>

<body class="bg-gray-100 min-h-screen">

    <!-- Main Container -->
    <div class="min-h-screen flex items-center justify-center p-4">

        <!-- Product Card -->
        <div
            class="w-full max-w-sm sm:max-w-md md:max-w-lg
                   bg-white
                   rounded-2xl
                   shadow-product
                   overflow-hidden
                   transition
                   duration-300
                   hover:-translate-y-2">

            <!-- Product Image -->
            <img
                src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=800&q=80"
                alt="Running Shoes"
                class="w-full h-56 sm:h-64 md:h-72 object-cover">

            <!-- Product Details -->
            <div class="p-5 sm:p-6 md:p-8">

                <!-- Product Name -->
                <h1
                    class="text-xl sm:text-2xl md:text-3xl
                           font-bold text-gray-800">

                    Premium Running Shoes

                </h1>

                <!-- Description -->
                <p
                    class="mt-3
                           text-sm sm:text-base
                           text-gray-600">

                    Comfortable and lightweight running shoes
                    designed for everyday workouts.

                </p>

                <!-- Rating -->
                <div class="mt-4 flex items-center gap-2">

                    <span class="text-yellow-500">
                        ★★★★★
                    </span>

                    <span class="text-sm text-gray-500">
                        4.8 / 5
                    </span>

                </div>

                <!-- Price + Button -->
                <div
                    class="mt-6
                           flex flex-col
                           sm:flex-row
                           sm:items-center
                           sm:justify-between
                           gap-4">

                    <!-- Price -->
                    <div>

                        <p class="text-gray-400 line-through text-sm">
                            ₹4,999
                        </p>

                        <p
                            class="text-2xl
                                   font-bold
                                   text-primary">

                            ₹3,499

                        </p>

                    </div>

                    <!-- Button -->
                    <button
                        class="w-full sm:w-auto
                               bg-primary
                               text-white
                               px-6 py-3
                               rounded-lg
                               font-semibold
                               hover:bg-blue-700
                               transition">

                        Buy Now

                    </button>

                </div>

            </div>

        </div>

    </div>

</body>

</html>
