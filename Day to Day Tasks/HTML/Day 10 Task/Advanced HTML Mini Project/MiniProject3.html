<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📝 To-Do List</title>
</head>
<body>

    <h1>📝 To Do List</h1>
    
    <form>
        <label for="task">Enter Task:</label>
        <input type="text" id="task" name="task" placeholder="Enter a Task">
        <button type="submit">Add Task</button>

        <button type="clear">Clear All</button>

        <h2>✅ Task List</h2>

        <input type="checkbox" id="task1" name="task1">
        <label for="task1">Complete HTML Assignment</label><br>

        <input type="checkbox" id="task2" name="task2">
        <label for="task2">Practice Semantic HTML</label><br>

        <input type="checkbox" id="task3" name="task3">
        <label for="task3">Learn Forms</label><br>

        <input type="checkbox" id="task4" name="task4">
        <label for="task4">Submit Internship Task</label>
    </form>
</body>
</html>
