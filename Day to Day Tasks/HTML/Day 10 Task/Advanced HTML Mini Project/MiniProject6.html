<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Survey Form</title>
    <style>
        h1 {
            display: inline;
        }
    </style>
</head>
<body>

    <h1>Accessible Survey Form</h1>
    <form>
        <label for="name">Full Name:</label><br>
        <input type="text" id="name" name="name" aria-label="Enter your full name" pattern="[A-Za-z ]{3,30}" required><br><br>

        <label for="age">Age:</label><br>
        <input type="number" id="age" name="age" aria-label="Enter your age" min="1" max="120" required><br><br>

        <label for="color">Favorite Color:</label><br>
        <input type="color" id="color" name="color" aria-label="Select your favorite color" required><br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
