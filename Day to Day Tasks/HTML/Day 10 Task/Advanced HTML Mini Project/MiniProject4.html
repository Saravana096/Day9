<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canvas Drawing Board</title>
</head>
<body>
    <h1>Canvas Drawing Board</h1>

    <canvas id="drawingCanvas" width="600" height="400">
        Your browser does not support the canvas element.
    </canvas>

    <br><br>

    <h3>Shape Buttons</h3>
    <button id="rectangleBtn">Draw Rectangle</button>
    <button id="circleBtn">Draw Circle</button>

    <h3>Color Buttons</h3>
    <button id="redBtn">Red</button>
    <button id="blueBtn">Blue</button>
    <button id="greenBtn">Green</button>
    <button id="blackBtn">Black</button>

    <h3>Bonus - Free Draw</h3>
    <button id="freeDrawBtn">Enable Mouse Drawing</button>
    <button id="clearBtn">Clear Canvas</button>
</body>
</html>
