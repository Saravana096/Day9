<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVG Icon Gallery</title>
</head>
<body>
    <h1>SVG Icon Gallery</h1>

    <!-- Heart Icon -->
    <svg width="100" height="100" viewBox="0 0 24 24">
        <path fill="red"
            d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5
            2 5.42 4.42 3 7.5 3c1.74 0 3.41.81
            4.5 2.09C13.09 3.81 14.76 3 16.5 3
            19.58 3 22 5.42 22 8.5c0 3.78-3.4
            6.86-8.55 11.54L12 21.35z"/>
    </svg>

    <!-- Star Icon -->
    <svg width="100" height="100" viewBox="0 0 24 24">
        <polygon fill="gold"
            points="12,2 15,9 22,9 17,14 19,22 12,18 5,22 7,14 2,9 9,9"/>
    </svg>

    <!-- Trash Icon -->
    <svg width="100" height="100" viewBox="0 0 24 24">
        <rect x="7" y="7" width="10" height="13" fill="gray"/>
        <rect x="6" y="4" width="12" height="2" fill="black"/>
        <rect x="10" y="2" width="4" height="2" fill="black"/>
    </svg>

            <h2>Simple SVG Human</h2>

        <svg width="300" height="350">

            <!-- Head -->
            <circle cx="150" cy="50" r="30"
                    fill="#FFDAB9"
                    stroke="black"
                    stroke-width="2"/>

            <!-- Left Eye -->
            <circle cx="140" cy="45" r="3" fill="black"/>

            <!-- Right Eye -->
            <circle cx="160" cy="45" r="3" fill="black"/>

            <!-- Mouth -->
            <line x1="140" y1="65"
                x2="160" y2="65"
                stroke="red"
                stroke-width="2"/>

            <!-- Neck -->
            <line x1="150" y1="80"
                x2="150" y2="95"
                stroke="black"
                stroke-width="4"/>

            <!-- Shirt -->
            <rect x="120"
                y="95"
                width="60"
                height="80"
                rx="10"
                fill="skyblue"
                stroke="black"
                stroke-width="2"/>

            <!-- Left Hand -->
            <line x1="120" y1="110"
                x2="80" y2="160"
                stroke="black"
                stroke-width="5"/>

            <!-- Right Hand -->
            <line x1="180" y1="110"
                x2="220" y2="160"
                stroke="black"
                stroke-width="5"/>

            <!-- Left Leg -->
            <line x1="140" y1="175"
                x2="120" y2="260"
                stroke="black"
                stroke-width="5"/>

            <!-- Right Leg -->
            <line x1="160" y1="175"
                x2="180" y2="260"
                stroke="black"
                stroke-width="5"/>

            <!-- Left Shoe -->
            <ellipse cx="115"
                    cy="270"
                    rx="12"
                    ry="5"
                    fill="brown"/>

            <!-- Right Shoe -->
            <ellipse cx="185"
                    cy="270"
                    rx="12"
                    ry="5"
                    fill="brown"/>

        </svg>

</body>
</html>
