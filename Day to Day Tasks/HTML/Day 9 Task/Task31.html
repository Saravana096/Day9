<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Step Registration Form</title>

    <style>

        body{
            font-family: Arial, sans-serif;
        }

        .step{
            display:none;
            width:300px;
            margin:20px auto;
            padding:20px;
            border:1px solid black;
        }

        .step.active{
            display:block;
        }

        input{
            width:100%;
            padding:8px;
            margin:10px 0;
        }

        button{
            padding:8px 15px;
            margin-top:10px;
        }

    </style>

</head>
<body>

<h2 align="center">Registration Form</h2>

<!-- Step 1 -->

<div class="step active" id="step1">

    <h3>Step 1 - Email</h3>

    <input type="email" id="email" placeholder="Enter Email">

    <button onclick="nextStep1()">Next</button>

</div>

<!-- Step 2 -->

<div class="step" id="step2">

    <h3>Step 2 - Password</h3>

    <input type="password" id="password" placeholder="Enter Password">

    <button onclick="previousStep(1)">Previous</button>

    <button onclick="nextStep2()">Next</button>

</div>

<!-- Step 3 -->

<div class="step" id="step3">

    <h3>Step 3 - Profile Info</h3>

    <input type="text" id="name" placeholder="Enter Name">

    <input type="number" id="age" placeholder="Enter Age">

    <button onclick="previousStep(2)">Previous</button>

    <button onclick="submitForm()">Submit</button>

</div>

<script>

function showStep(step){

    document.querySelectorAll(".step").forEach(function(div){

        div.classList.remove("active");

    });

    document.getElementById("step"+step).classList.add("active");

}

function nextStep1(){

    let email=document.getElementById("email").value;

    if(email==""){

        alert("Please enter Email");

        return;

    }

    showStep(2);

}

function nextStep2(){

    let password=document.getElementById("password").value;

    if(password.length<6){

        alert("Password must be at least 6 characters");

        return;

    }

    showStep(3);

}

function previousStep(step){

    showStep(step);

}

function submitForm(){

    let name=document.getElementById("name").value;
    let age=document.getElementById("age").value;

    if(name=="" || age==""){

        alert("Please complete Profile Information");

        return;

    }

    alert("Registration Successful!");

}

</script>
    
</body>
</html>
