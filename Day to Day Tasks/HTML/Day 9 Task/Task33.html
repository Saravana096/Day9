<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Form</title>
</head>
<body>
    <h2>Subscription Form</h2>

    <form>

        <label>Email:</label><br>
        <input
            type="email"
            placeholder="Enter your email"
            required>

        <br><br>

        <label>Gender:</label><br>

        <input
            type="radio"
            name="gender"
            value="Male"
            required> Male

        <input
            type="radio"
            name="gender"
            value="Female"> Female

        <input
            type="radio"
            name="gender"
            value="Other"> Other

        <br><br>

        <label>Favorite Color:</label><br>

        <input
            type="color"
            required>

        <br><br>

        <input
            type="submit"
            value="Subscribe">

    </form>
</body>
</html>
