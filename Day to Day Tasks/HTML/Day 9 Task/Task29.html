<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated SVG Banner</title>
</head>
<body>
    <h2>Welcome to My Website</h2>

<svg width="700" height="220">

    <!-- Banner Background -->
    <rect
        x="0"
        y="0"
        width="700"
        height="220"
        fill="skyblue">
    </rect>

    <!-- Animated Sun -->
    <circle
        cx="100"
        cy="70"
        r="30"
        fill="gold">

        <animate
            attributeName="r"
            values="30;40;30"
            dur="2s"
            repeatCount="indefinite"/>

    </circle>

    <!-- Animated Cloud -->
    <ellipse
        cx="350"
        cy="80"
        rx="45"
        ry="25"
        fill="white">

        <animate
            attributeName="cx"
            values="350;500;350"
            dur="6s"
            repeatCount="indefinite"/>

    </ellipse>

    <ellipse
        cx="390"
        cy="80"
        rx="45"
        ry="25"
        fill="white">

        <animate
            attributeName="cx"
            values="390;540;390"
            dur="6s"
            repeatCount="indefinite"/>

    </ellipse>

    <!-- Banner Text -->
    <text
        x="180"
        y="170"
        font-size="36"
        fill="navy">

        Welcome

        <animate
            attributeName="fill"
            values="navy;red;navy"
            dur="2s"
            repeatCount="indefinite"/>

    </text>

</svg>
</body>
</html>
