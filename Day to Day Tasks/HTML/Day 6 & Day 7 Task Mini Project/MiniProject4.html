<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Comparison Table</title>
</head>
<body>
    <h1>Project 4 - Product Comparison Table</h1>

    <table border="1">

        <thead>

            <tr>
                <th colspan="3">Product Comparison</th>
            </tr>

            <tr>
                <th>Feature</th>
                <th>Laptop A</th>
                <th>Laptop B</th>
            </tr>

        </thead>

        <tbody>

            <tr>
                <td>Processor</td>
                <td>Intel Core i5</td>
                <td>Intel Core i7</td>
            </tr>

            <tr>
                <td>RAM</td>
                <td>8 GB</td>
                <td>16 GB</td>
            </tr>

            <tr>
                <td>Storage</td>
                <td>512 GB SSD</td>
                <td>1 TB SSD</td>
            </tr>

            <tr>
                <td>Price</td>
                <td>₹55,000</td>
                <td>₹75,000</td>
            </tr>

        </tbody>

    </table>
</body>
</html>
