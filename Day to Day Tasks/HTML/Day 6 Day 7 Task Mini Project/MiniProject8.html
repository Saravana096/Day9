<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Gallery</title>
</head>
<body>
    <h1>Project 8 - Multimedia Gallery</h1>

    <figure>

        <img src="Nature.jpg" alt="Nature Image" width="300" height="200">

        <figcaption>Beautiful Nature</figcaption>

    </figure>

    <figure>

        <video width="300" controls>
            <source src="video.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>

        <figcaption>Sample Video</figcaption>

    </figure>

    <figure>

        <audio controls>
            <source src="audio.mp3" type="audio/mpeg">
            Your browser does not support the audio tag.
        </audio>

        <figcaption>Sample Audio</figcaption>

    </figure>
</body>
</html>
