<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Navigation Bar</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:'Poppins',sans-serif;
            background:#f4f4f4;
        }

        nav{
            background:#0d6efd;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:20px 60px;
        }

        .logo{
            color:white;
            font-size:30px;
            font-weight:bold;
            letter-spacing:2px;
        }

        nav ul{
            display:flex;
            list-style:none;
        }

        nav ul li{
            margin-left:25px;
        }

        nav ul li a{
            color:white;
            text-decoration:none;
            letter-spacing:1.5px;
            font-size:18px;
            transition:0.3s;
        }

        nav ul li a:hover{
            color:#ffd43b;
        }

        @media(max-width:768px){

            nav{
                flex-direction:column;
            }

            nav ul{
                flex-direction:column;
                text-align:center;
                margin-top:15px;
            }

            nav ul li{
                margin:10px 0;
            }

        }
    </style>
</head>
<body>
    <nav>

        <div class="logo">
            SK
        </div>

        <ul>

            <li><a href="#">Home</a></li>

            <li><a href="#">About</a></li>

            <li><a href="#">Services</a></li>

            <li><a href="#">Portfolio</a></li>

            <li><a href="#">Contact</a></li>

        </ul>

    </nav>
</body>
</html>
