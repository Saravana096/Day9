<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CTA Promo</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f4f4;
        }

        .cta{
            min-height:100vh;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;

            background:linear-gradient(135deg,#0d6efd,#6f42c1);

            color:white;

            padding:3rem 2rem;
        }

        .cta h1{
            font-size:3rem;
            margin-bottom:1rem;
        }

        .cta p{
            font-size:1.2rem;
            max-width:700px;
            line-height:1.8;
            margin-bottom:2em;
        }

        .btn{
            text-decoration:none;
            background:white;
            color:#0d6efd;
            padding:1em 2em;
            border-radius:8px;
            font-size:1.1rem;
            font-weight:bold;
            transition:0.3s;
        }

        .btn:hover{
            background:#ffc107;
            color:#000;
        }
    </style>
</head>
<body>
    <section class="cta">

        <h1>Start Your Journey Today</h1>

        <p>
            Join thousands of users who trust our platform.
            Sign up now and experience the best features for free.
        </p>

        <a href="#" class="btn">Get Started</a>

    </section>
</body>
</html>
