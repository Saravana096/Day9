<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Section</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 60px;
        }


        .features-section {

            max-width: 800px;

            margin: auto;

            padding: 20px;

            background-color: white;

            border-radius: 10px;

            box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        }


        .features-section h1 {

            text-align: center;

            font-size: 22px;

            margin-bottom: 20px;

            color: #222;
        }

        .features-container {

            display: flex;

            gap: 15px;

            /* Allow items to move to
               next row on smaller screens */
            flex-wrap: wrap;
        }

        .feature {

            /* Each feature can grow */
            flex-grow: 1;

            flex-basis: 200px;

            padding: 12px;

            background-color: white;

            border: 1px solid #ddd;

            border-radius: 6px;

            text-align: center;

            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12);
        }


        .feature.feature-two {

            /* Feature 2 takes more
               available space */
            flex-grow: 2;
        }

        .feature-icon {

            font-size: 35px;

            margin-bottom: 8px;

            /* Align this individual
               item vertically */
            align-self: center;
        }


        .feature h2 {

            font-size: 16px;

            margin-bottom: 5px;

            color: #222;
        }

        .feature p {

            font-size: 14px;

            color: #444;

            line-height: 1.4;
        }

        @media (max-width: 700px) {

            body {
                padding: 20px;
            }

            .features-container {

                /* Keep flex layout but
                   allow wrapping */
                flex-wrap: wrap;
            }

            .feature {

                flex-basis: 100%;
            }

        }
    </style>
</head>
<body>
    <section class="features-section">


        <!-- Heading -->

        <h1>
            Our Features
        </h1>

        <div class="features-container">

            <div class="feature">

                <div class="feature-icon">
                    ⚡
                </div>

                <h2>
                    Fast Performance
                </h2>

                <p>
                    Experience lightning-fast load times.
                </p>

            </div>

            <div class="feature feature-two">

                <div class="feature-icon">
                    🔒
                </div>

                <h2>
                    Secure Platform
                </h2>

                <p>
                    Enhanced security to protect your data.
                </p>

            </div>

            <div class="feature">

                <div class="feature-icon">
                    🔗
                </div>

                <h2>
                    Easy Integration
                </h2>

                <p>
                    Seamless integration with your tools.
                </p>

            </div>


        </div>

    </section>
</body>
</html>
