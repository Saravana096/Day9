<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Card Gallery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background: linear-gradient(to right, #f8f9fa, #e9ecef);
            padding: 40px 0;
        }

        .card {
            border: none;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .card-img-top {
            height: 220px;
            object-fit: cover;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="row g-4">
            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=80" class="card-img-top img-fluid" alt="Nature">
                    <div class="card-body">
                        <h5 class="card-title">Beautiful Nature</h5>
                        <p class="card-text">A peaceful view of mountains and clouds with a fresh and calm atmosphere.</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=800&q=80" class="card-img-top img-fluid" alt="Forest">
                    <div class="card-body">
                        <h5 class="card-title">Forest Trail</h5>
                        <p class="card-text">A scenic forest path perfect for travel, photography, and outdoor adventures.</p>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100">
                    <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=800&q=80" class="card-img-top img-fluid" alt="Ocean">
                    <div class="card-body">
                        <h5 class="card-title">Ocean View</h5>
                        <p class="card-text">A vibrant ocean scene that brings a relaxing and refreshing summer mood.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
