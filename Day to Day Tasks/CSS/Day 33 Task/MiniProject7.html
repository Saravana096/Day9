<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Contact Section</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            font-family: Arial, sans-serif;

            background-color: #f1f5f9;

            min-height: 100vh;

            padding: 50px 20px;
        }

        .contact-container {

            max-width: 900px;

            margin: auto;

            display: flex;
            flex-direction: row;

            gap: 30px;

            background-color: white;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .contact-form,
        .contact-info {

            flex: 1;

            padding: 25px;

            border-radius: 10px;
        }

        .contact-form {

            background-color: #f8fafc;

            border: 1px solid #e2e8f0;
        }


        .contact-form h2 {

            color: #1e293b;

            margin-bottom: 20px;
        }

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #334155;
        }

        .form-group input,
        .form-group textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            font-size: 15px;

            outline: none;
        }


        .form-group textarea {

            height: 120px;

            resize: vertical;
        }

        .form-group input:focus,
        .form-group textarea:focus {

            border-color: #2563eb;
        }


        .submit-button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background-color: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }


        .submit-button:hover {

            background-color: #1d4ed8;
        }


        .contact-info {

            background-color: #2563eb;

            color: white;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .contact-info h2 {

            margin-bottom: 25px;
        }

        .info-item {

            margin-bottom: 20px;
        }


        .info-item h3 {

            margin-bottom: 5px;

            font-size: 16px;
        }


        .info-item p {

            line-height: 1.5;

            color: #dbeafe;
        }

        @media (max-width: 768px) {

            .contact-container {

                /* Stack form and information
                   vertically */
                flex-direction: column;

                padding: 20px;
            }


            .contact-form,
            .contact-info {

                width: 100%;
            }

        }
    </style>
</head>
<body>
    <section class="contact-container">

        <div class="contact-form">

            <h2>
                Contact Us
            </h2>


            <form>

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>


                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        placeholder="Write your message"
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="submit-button"
                >
                    Send Message
                </button>


            </form>

        </div>

        <div class="contact-info">

            <h2>
                Get In Touch
            </h2>


            <div class="info-item">

                <h3>
                    📞 Phone
                </h3>

                <p>
                    +91 98765 43210
                </p>

            </div>

            <div class="info-item">

                <h3>
                    📧 Email
                </h3>

                <p>
                    contact@example.com
                </p>

            </div>

            <div class="info-item">

                <h3>
                    📍 Address
                </h3>

                <p>
                    123 Main Street,<br>
                    Chennai, Tamil Nadu
                </p>

            </div>


        </div>


    </section>
</body>
</html>
