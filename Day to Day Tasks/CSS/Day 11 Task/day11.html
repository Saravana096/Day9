<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <style>
        h2 {
            color:#38BDF8;
            font-size:38px;
            font-family:Arial, Helvetica, sans-serif;
        }
    </style>
</head>
<body>
    <!--Inline CSS applied to h1 tag-->
    <h1 style="background-color:#1E293B;
        color:#F8FAFC; font-size:45px; font-family:Arial, Helvetica, sans-serif;">Personal Bio Page</h1>

    <!--Internal CSS applied to h2 tag-->
    <h2>About Me</h2>
    <hr>
    <!--External CSS applied to img tag-->
    <img src="profile.jpeg" alt="Profile Picture">

    <!--Inline CSS applied to p tag-->
    <p style="color:#CBD5E1; font-size:20px; font-family:Arial, Helvetica, sans-serif;">Hello! My name is Saravanakumar V. I am passionate about Web Development and enjoy learning new technologies.</p>

    <hr>
    
    <!--External CSS applied to body, h3 and p tag-->
    <h3>My Goal:</h3>
    <p>My goal is to become a Full Stack Developer and build modern, user-friendly web applications.</p>

    <!--External CSS applied to small tag-->
    <small>&copy; Saravanakumar V 2026</small>
</body>
</html>
