<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testimonials Section</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            background:#f4f4f4;

            text-align:center;

        }

        section{

            padding:40px;

        }

        section h1{

            margin-bottom:30px;

            color:#2c3e50;

        }

        figure{

            background:rgba(52,152,219,0.25);

            padding:20px;

            margin:20px auto;

            width:70%;

            border-radius:10px;

            transition:0.3s;

        }

        figure:hover{

            background:rgba(52,152,219,0.5);

        }

        blockquote{

            font-size:20px;

            font-style:italic;

            margin-bottom:15px;

        }

        figcaption{

            font-weight:bold;

            color:#2c3e50;

        }

        footer{

            background:#2c3e50;

            color:white;

            padding:20px;

            margin-top:30px;

        }
    </style>
</head>
<body>
    <section>

        <h1>What Our Clients Say</h1>

        <figure>

            <blockquote>
                "Excellent service! Highly recommended."
            </blockquote>

            <figcaption>
                — John Smith
            </figcaption>

        </figure>

        <figure>

            <blockquote>
                "Professional team and amazing support."
            </blockquote>

            <figcaption>
                — Sarah Johnson
            </figcaption>

        </figure>

        <figure>

            <blockquote>
                "Best experience I've ever had."
            </blockquote>

            <figcaption>
                — Michael Brown
            </figcaption>

        </figure>

    </section>

    <footer>

        <p>© 2026 Testimonials Section</p>

    </footer>
</body>
</html>
