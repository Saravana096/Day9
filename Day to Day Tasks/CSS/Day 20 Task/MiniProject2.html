<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .container{
            width:550px;
            height:400px;
            margin:80px auto;
            background:#ffffff;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .card{

            width:420px;
            height:330px;

            background:radial-gradient(circle, #a9ddf6, #eaf8ff);

            text-align:center;

            padding:120px 30px;

        }

        .card h1{

            color:#1d4ca1;

            margin-bottom:20px;

        }

        .card p{

            font-size:18px;

            color:#444;

            margin-bottom:20px;

        }

        .card button{

            background:#2ecc71;

            color:white;

            border:2px solid #1d7a46;

            padding:8px 20px;

            cursor:pointer;

            font-size:16px;

        }

        .card button:hover{

            background:#27ae60;

        }
    </style>
</head>
<body>
    <div class="container">

        <div class="card">

            <h1>Product Name</h1>

            <p>
                This is an amazing product that you will love.
            </p>

            <button>Buy Now</button>

        </div>

    </div>
</body>
</html>
