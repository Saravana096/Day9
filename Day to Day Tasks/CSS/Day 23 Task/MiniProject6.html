<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Table</title>
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .pricing-container{
            width:100%;
            display:flex;
            justify-content:center;
            gap:20px;                  /* px gap */
            padding:20px;
        }

        .box{
            width:30%;                 /* % */
            background:white;
            border-radius:10px;
            text-align:center;
            padding:25px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        .box h2{
            margin-bottom:20px;
            color:#333;
        }

        .price{
            font-size:4vmin;           /* vmin */
            color:#007bff;
            font-weight:bold;
            margin-bottom:20px;
        }

        .features{
            list-style:none;
            margin-bottom:25px;
        }

        .features li{
            font-size:1rem;            /* rem */
            margin-bottom:12px;
        }

        button{
            padding:12px 25px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:1rem;
        }

        button:hover{
            background:#0056b3;
        }

    </style>
</head>
<body>
    <div class="pricing-container">

        <div class="box">

            <h2>Basic</h2>

            <div class="price">$9/month</div>

            <ul class="features">
                <li>1 Website</li>
                <li>10 GB Storage</li>
                <li>Email Support</li>
            </ul>

            <button>Choose Plan</button>

        </div>

        <div class="box">

            <h2>Pro</h2>

            <div class="price">$19/month</div>

            <ul class="features">
                <li>10 Websites</li>
                <li>100 GB Storage</li>
                <li>Priority Support</li>
            </ul>

            <button>Choose Plan</button>

        </div>

        <div class="box">

            <h2>Premium</h2>

            <div class="price">$49/month</div>

            <ul class="features">
                <li>Unlimited Websites</li>
                <li>1 TB Storage</li>
                <li>24/7 Support</li>
            </ul>

            <button>Choose Plan</button>

        </div>

    </div>  
</body>
</html>
