<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Banner</title>
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .banner{
            width:100vw;                     /* vw */
            min-height:40vh;
            background:linear-gradient(to right,#007bff,#00b4d8);
            color:white;
            display:flex;
            flex-direction:column;
            justify-content:center;
            align-items:center;
            text-align:center;
            padding:40px;
        }

        .banner h1{
            font-size:4vmin;                /* vmin */
            margin-bottom:15px;
        }

        .banner p{
            font-size:1.2em;                /* em */
            margin-bottom:25px;
        }

        .form{
            width:60%;
        }

        .form input{
            width:70%;                      /* % */
            padding:12px;
            border:none;
            border-radius:5px;
            font-size:1rem;                 /* rem */
        }

        .form button{
            padding:12px 25px;              /* px */
            margin-left:10px;               /* px */
            border:none;
            border-radius:5px;
            background:#222;
            color:white;
            font-size:1rem;                 /* rem */
            cursor:pointer;
        }

        .form button:hover{
            background:black;
        }

        @media(max-width:768px){

            .form{
                width:90%;
            }

            .form input{
                width:100%;
                margin-bottom:15px;
            }

            .form button{
                margin-left:0;
                width:100%;
            }

        }

    </style>
</head>
<body>
    <section class="banner">

        <h1>Subscribe to Our Newsletter</h1>

        <p>
            Get the latest updates, articles, and exclusive offers directly
            to your inbox.
        </p>

        <form class="form">

            <input
                type="email"
                placeholder="Enter your email address">

            <button type="submit">
                Subscribe
            </button>

        </form>

    </section>
</body>
</html>
