<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Contact</title>
    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .contact-section{
            height:100vh;              /* vh */
            display:flex;
            justify-content:center;
            align-items:center;
            background:#e8f4ff;
        }

        .container{
            width:60%;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.2);
        }

        h1{
            text-align:center;
            margin-bottom:20px;        /* px */
        }

        .instruction{
            font-size:1.2em;           /* em */
            text-align:center;
            margin-bottom:25px;        /* px */
            color:#555;
        }

        label{
            display:block;
            font-size:1rem;            /* rem */
            margin-bottom:8px;         /* px */
            font-weight:bold;
        }

        input,
        textarea{
            width:100%;                /* % */
            padding:12px;
            margin-bottom:20px;        /* px */
            border:1px solid #ccc;
            border-radius:5px;
            font-size:1rem;
        }

        textarea{
            resize:none;
        }

        button{
            padding:12px 25px;
            background:#007bff;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
            font-size:1rem;
        }

        button:hover{
            background:#0056b3;
        }

        .contact-info{
            margin-top:30px;           /* px */
            border-top:2px solid #ddd;
            padding-top:20px;          /* px */
        }

        .contact-info h2{
            margin-bottom:15px;        /* px */
        }

        .contact-info p{
            margin-bottom:10px;        /* px */
        }

    </style>
</head>
<body>
     <section class="contact-section">

        <div class="container">

            <h1>Contact Us</h1>

            <p class="instruction">
                Fill out the form below and we'll get back to you soon.
            </p>

            <form>

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email">

                <label for="message">Message</label>
                <textarea id="message" rows="5" placeholder="Enter your message"></textarea>

                <button type="submit">Send Message</button>

            </form>

            <div class="contact-info">

                <h2>Contact Information</h2>

                <p>📍 Chennai, Tamil Nadu</p>

                <p>📞 +91 9876543210</p>

                <p>📧 support@example.com</p>

            </div>

        </div>

    </section>
</body>
</html>
