<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Screen Landing Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            height: 100vh;
            background: linear-gradient(135deg, #0f2027,#203a43, #2c5463);
            color: white;
        }

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 60px
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #00e5ff;
            transition: 0.3s;
            cursor:grab;
            
        }

        .logo:hover{
            transform: scale3d(1.5, 1.5, 1);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 30px;
            
        }

        nav ul li a{
            font-size: 20px;
            text-decoration: none;
            color: white;
            transition: 0.3s ease;
            display: inline-block;
        }

        nav ul li a:hover {
            color: #00e5ff;
            transform: scale3d(1.3, 1.3, 1);
        }

        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            height: calc(100vh - 80px);
        }

        .hero h1 {
            margin-bottom: 20px;
            font-size: 60px;
        }

        .hero h1::selection {
            background-color: grey;
            color: #00e5ff;
        }
        .hero p {
            font-size: 22px;
            line-height: 1.6;
            width: 60%;
            margin-bottom: 30px;
        }

        .hero p::selection {
            background-color: grey;
            color: #00e5ff;
        }

        .hero h1::before{
            content: "🚀";
            transition: 0.3s ease;
            display: inline-block;
        }

        .hero h1:hover::before {
            transform: scale3d(1.2,1.2,1);
        }

        .hero button {
            background-color: #00e5ff;
            color: black;
            cursor: pointer;
            font-size: 22px;
            border-radius: 8px;
            border: none;
            padding: 15px 35px;
            transition: 0.3s;
        }

        .hero button:hover{
            background-color: aliceblue;
            transform: scale3d(1.2,1.2,1);
        }
    </style>
</head>
<body>
    <nav>
        
        <div class="logo">
            
            SK

        </div>

        <ul>

            <li><a href="#">Home</a></li>

            <li><a href="#">About</a></li>

            <li><a href="#">Services</a></li>

            <li><a href="#">Contact</a></li>

        </ul>
    </nav>

    <section class="hero">

        <h1>Welcome to My Website</h1>

        <p>

            Learn HTML, CSS, and JavaScript through real-world projects. 
            Build beautiful and responsive websites from beginner to advanced level.
        
        </p>

        <button> 
            Get Started
        </button>
    </section>
</body>
</html>
