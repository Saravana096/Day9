<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smooth Scroll Navigation</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        html{
            scroll-behavior:smooth;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
        }

        nav{
            background:#0d6efd;
            text-align:center;
            padding:20px;
        }

        nav a{
            color:white;
            text-decoration:none;
            margin:0 20px;
            font-size:18px;
            font-weight:bold;
        }

        nav a:hover{
            color:yellow;
        }

        section{
            height:100vh;
            padding:40px;
            text-align:center;
        }

        #home{
            background:#f8f9fa;
        }

        #about{
            background:#d1ecf1;
        }

        #services{
            background:#d4edda;
        }

        #contact{
            background:#fff3cd;
        }

        h1{
            margin-bottom:20px;
        }
    </style>
</head>
<body>
    <nav>

        <a href="#home">Home</a>

        <a href="#about">About</a>

        <a href="#services">Services</a>

        <a href="#contact">Contact</a>

    </nav>

    <section id="home">

        <h1>Home</h1>

        <p>Welcome to our website.</p>

    </section>

    <section id="about">

        <h1>About</h1>

        <p>Learn more about our company.</p>

    </section>

    <section id="services">

        <h1>Services</h1>

        <p>We provide web development and design services.</p>

    </section>

    <section id="contact">

        <h1>Contact</h1>

        <p>Email: info@example.com</p>

    </section>
</body>
</html>
