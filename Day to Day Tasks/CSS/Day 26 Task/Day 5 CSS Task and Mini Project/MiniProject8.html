<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Newsletter Banner</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
        }

        .newsletter{

            width:100vw;

            height:60vh;

            background-image:url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1600");

            background-size:cover;

            background-position:center;

        }

        .overlay{

            width:100%;

            height:100%;

            background:rgba(0,0,0,0.5);

            display:flex;

            flex-direction:column;

            justify-content:center;

            align-items:center;

        }

        .overlay h1{

            color:white;

            font-size:3vw;

            text-shadow:3px 3px 6px black;

            margin-bottom:2vh;

        }

        .overlay p{

            color:white;

            font-size:1.3vw;

            margin-bottom:3vh;

        }

        .overlay input{

            width:40%;

            padding:12px;

            border:none;

            border-radius:5px;

            margin-bottom:2vh;

            font-size:1rem;

        }

        .overlay button{

            padding:12px 30px;

            background:#0d6efd;

            color:white;

            border:none;

            border-radius:5px;

            cursor:pointer;

            transition:0.3s;

        }

        .overlay button:hover{

            background:#084298;

        }
    </style>
</head>
<body>
    <section class="newsletter">

        <div class="overlay">

            <h1>Subscribe to Our Newsletter</h1>

            <p>Get the latest updates directly in your inbox.</p>

            <input type="email" placeholder="Enter Your Email">

            <button>Sign Up</button>

        </div>

    </section>
</body>
</html>
