<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page Hero Section</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
        }

        .hero{

            height:100vh;

            background-image:url("https://images.unsplash.com/photo-1497366754035-f200968a6e72?w=1600");

            background-size:cover;

            background-position:center;

            text-align:center;

            padding-top:150px;

        }

        .hero h1{

            color:white;

            font-size:55px;

            text-shadow:4px 4px 8px black;

            margin-bottom:20px;

        }

        .hero p{

            color:white;

            font-size:22px;

            margin-bottom:30px;

        }

        .hero button{

            padding:15px 35px;

            font-size:18px;

            background:orangered;

            color:white;

            border:none;

            border-radius:8px;

            cursor:pointer;

            box-shadow:0px 6px 12px gray;

        }

        .hero button:hover{

            background:darkred;

        }
    </style>
</head>
<body>
    <section class="hero">

        <h1>Welcome to Our Website</h1>

        <p>Build Modern Websites with HTML & CSS</p>

        <button>Get Started</button>

    </section>
</body>
</html>
