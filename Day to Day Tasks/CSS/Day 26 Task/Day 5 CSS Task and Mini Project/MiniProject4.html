<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f2f2f2;
        }

        header{
            background:linear-gradient(to right,tomato,lightsalmon);
            color:white;
            padding:25px;
        }

        header h1{
            margin-bottom:8px;
        }

        header p{
            font-size:14px;
        }

        .container{
            width:80%;
            margin:30px auto;
        }

        article{
            background:white;
            border:1px solid #ddd;
            box-shadow:0 4px 8px rgba(0,0,0,0.2);
            padding:20px;
            margin-bottom:20px;
        }

        article h2{
            margin-bottom:10px;
        }

        article p{
            color:#555;
            line-height:1.6;
        }

        footer{
            background:#333;
            color:white;
            padding:18px;
            text-shadow:2px 2px 4px black;
        }
    </style>
</head>
<body>
    <header>

        <h1>My Blog</h1>

        <p>Sharing Thoughts & Ideas</p>

    </header>

    <div class="container">

        <article>

            <h2>Blog Post 1</h2>

            <p>
                Lorem ipsum dolor sit amet, consectetur adipisicing elit.
                Quisque sit amet sagittis urna.
            </p>

        </article>

        <article>

            <h2>Blog Post 2</h2>

            <p>
                Sed accumsan elit at orci suscipit, a malesuada odio
                fermentum. Ut ultricies magna sed lorem malesuada.
            </p>

        </article>

    </div>

    <footer>

        <p>© 2025 My Blog. All Rights Reserved.</p>

    </footer>
</body>
</html>
