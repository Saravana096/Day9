<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Section</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            font-family:Arial, Helvetica, sans-serif;
            background:#f4f4f4;
        }

        .contact-section{

            min-height:100vh;

            background:radial-gradient(circle,#dbeafe,#93c5fd);

            display:flex;

            justify-content:center;

            align-items:center;

        }

        .contact-form{

            width:400px;

            background:white;

            padding:30px;

            border-radius:10px;

            box-shadow:0 5px 15px rgba(0,0,0,0.2);

        }

        .contact-form h1{

            text-align:center;

            margin-bottom:20px;

            color:#0d6efd;

        }

        .contact-form input,
        .contact-form textarea{

            width:100%;

            padding:12px;

            margin-bottom:15px;

            border:1px solid #ccc;

            border-radius:5px;

            font-size:16px;

        }

        .contact-form input:focus,
        .contact-form textarea:focus{

            border:2px solid #0d6efd;

            outline:none;

            box-shadow:0 0 8px #4facfe;

        }

        .contact-form textarea{

            resize:none;

            height:120px;

        }

        .contact-form button{

            width:100%;

            padding:12px;

            background:#0d6efd;

            color:white;

            border:none;

            border-radius:5px;

            cursor:pointer;

        }

        .contact-form button:hover{

            background:#084298;

        }
    </style>
</head>
<body>
    <section class="contact-section">

        <form class="contact-form">

            <h1>Contact Us</h1>

            <input type="text" placeholder="Enter Your Name">

            <input type="email" placeholder="Enter Your Email">

            <textarea placeholder="Enter Your Message"></textarea>

            <button type="submit">
                Send Message
            </button>

        </form>

    </section>
</body>
</html>
