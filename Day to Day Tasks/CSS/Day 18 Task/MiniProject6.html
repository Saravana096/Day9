<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup UI</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{

            min-height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;

            background:linear-gradient(135deg,#667eea,#764ba2);

            padding:20px;

        }

        .container{

            width:100%;
            max-width:1000px;

            display:flex;
            gap:30px;

        }

        .form-box{

            flex:1;

            background:white;

            padding:35px;

            border-radius:12px;

            box-shadow:0 10px 25px rgba(0,0,0,.2);

        }

        h2{

            text-align:center;

            margin-bottom:25px;

            color:#333;

        }

        input{

            width:100%;

            padding:14px;

            margin-bottom:18px;

            border:2px solid #ccc;

            border-radius:8px;

            outline:none;

            font-size:16px;

            transition:.3s;

        }


        input:focus{

            border-color:#667eea;

            box-shadow:0 0 8px rgba(102,126,234,.5);

        }

        button{

            width:100%;

            padding:14px;

            background:#667eea;

            color:white;

            border:none;

            border-radius:8px;

            font-size:18px;

            cursor:pointer;

            transition:.3s;

        }

        button:hover{

            background:#4c63d2;

        }

        @media(max-width:768px){

        .container{

            flex-direction:column;

        }

        }
    </style>
</head>
<body>
    <div class="container">

    <!-- Login Form -->
    <div class="form-box">

        <h2>Login</h2>

        <form>

            <input type="email" placeholder="Enter Email">

            <input type="password" placeholder="Enter Password">

            <button>Login</button>

        </form>

    </div>

    <!-- Signup Form -->
    <div class="form-box">

        <h2>Sign Up</h2>

        <form>

            <input type="text" placeholder="Full Name">

            <input type="email" placeholder="Email">

            <input type="password" placeholder="Password">

            <input type="password" placeholder="Confirm Password">

            <button>Create Account</button>

        </form>

    </div>

</div>
</body>
</html>
