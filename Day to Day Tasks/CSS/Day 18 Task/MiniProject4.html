<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Menu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        nav {
            width: 500px;
            background-color: #2c3e50;
            padding: 20px;
            border-radius: 8px;
        }

        ul {
            list-style: none;
        }

        li {
            margin: 15px 0;
        }

        a {
            text-decoration: none;
            color: white;
            font-size: 22px;
            transition: 0.3s;
        }

        a::before {
            content: "🌐";
            margin-right: 8px;
        }

        a:hover {
            color: #ff4d4d;
            padding-left: 10px;
        }

   
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">External Link</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
</body>
</html>
