<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            font-size: 35px;
            text-align: center;
        }
        nav {
            display: flex;
            background-color: aqua;
            font-size: 25px;
            justify-content: center;
            text-align: center;
            padding: 20px;
            gap: 30px;
        }

        nav a{
            text-decoration: none;
        }

        .menu-toggle{
            display: none;
            
        }

        @media(max-width:768px) {
         h1 {
            font-size: 25px;
            text-align: center;
        }

        nav {
            display: flex;
            background-color: chocolate;
            font-size: 15px;
            justify-content: center;
            padding: 10px;
            gap: 20px;
        }

        nav a{
            text-decoration: none;
            display: none;
        }

        .menu-toggle{
            display: block;
            background-color: blue;
            
            
        }
        }

    </style>
</head>
<body>
    <h1>Saravanakumar V</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
        <a href="#">Projects</a>

        <button class="menu-toggle">☰</button>
    </nav>

</body>
</html>
