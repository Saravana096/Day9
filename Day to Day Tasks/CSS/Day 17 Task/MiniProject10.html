<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Invitation Page</title>
    <style>
        body {
            background: repeating-linear-gradient(red, blue, yellow, purple, violet, seagreen);
        }

        button {
            background: conic-gradient(red, green, yellow, purple);
            font-size: 20px;
        }
        
    </style>
</head>
<body>
    <div class="container">
    <h1>Project 10 - Event Invitation Page</h1>

    <h2>RSVP Form</h2>

    <form>

        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>

        <button type="submit">Submit</button>

    </form>
    </div>
</body>
</html>
