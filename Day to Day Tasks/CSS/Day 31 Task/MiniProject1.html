<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Card Layout</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f4f7;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .card{
            width:320px;
            background:#ffffff;
            border-radius:12px;
            overflow:hidden;
            box-shadow:0 5px 15px rgba(0,0,0,0.2);
            transition:0.3s;
        }

        .card:hover{
            transform:translateY(-8px);
        }

        .card img{
            width:100%;
            height:200px;
            object-fit:cover;
        }

        .card-content{
            padding:20px;
        }

        .card-content h2{
            margin-bottom:10px;
            color:#333;
        }

        .card-content p{
            color:#666;
            line-height:1.6;
            margin-bottom:20px;
        }

        .btn{
            display:inline-block;
            text-decoration:none;
            background:#007bff;
            color:white;
            padding:10px 20px;
            border-radius:6px;
            transition:0.3s;
        }

        .btn:hover{
            background:#0056b3;
        }

    </style>
</head>
<body>
    <div class="card">

        <img src="https://picsum.photos/320/200" alt="Nature Image">

        <div class="card-content">

            <h2>Nature Beauty</h2>

            <p>
                Nature gives us peace, fresh air, and beautiful scenery.
                Enjoy the beauty of mountains, rivers, and forests.
            </p>

            <a href="#" class="btn">Read More</a>

        </div>

    </div>
</body>
</html>
