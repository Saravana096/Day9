<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feature Comparison Table</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f4f4;
        }

        /* Container */

        .container{
            width:90%;
            max-width:1000px;
            margin:30px auto;
        }

        /* Header */

        header{
            background:linear-gradient(to right,#6a11cb,#2575fc);
            color:white;
            text-align:center;
            padding:25px;
            border-radius:8px;
        }

        header p{
            margin-top:10px;
        }

        /* Table Section */

        .table-section{
            margin-top:40px;
            margin-bottom:40px;
        }

        /* Table */

        table{
            width:100%;
            border-collapse:collapse;
            background:white;
            box-shadow:0 5px 12px rgba(0,0,0,0.15);
        }

        th{
            background:#2575fc;
            color:white;
            padding:15px;
            border:1px solid #ddd;
        }

        td{
            padding:15px;
            border:1px solid #ddd;
            text-align:center;
        }

        /* Alternate Row Color */

        tr:nth-child(even){
            background:#f9f9f9;
        }

        /* Highlight Features */

        .available{
            background:#d4edda;
            color:#155724;
            font-weight:bold;
        }

        .not-available{
            background:#f8d7da;
            color:#721c24;
            font-weight:bold;
        }

        /* Footer */

        footer{
            background:#333;
            color:white;
            text-align:center;
            padding:18px;
            border-radius:6px;
        }

    </style>
</head>
<body>
    <div class="container">

        <header>

        <h1>Feature Comparison</h1>

        <p>Compare Product A and Product B</p>

        </header>

        <section class="table-section">

        <table>

        <tr>
        <th>Features</th>
        <th>Product A</th>
        <th>Product B</th>
        </tr>

        <tr>
        <td>Responsive Design</td>
        <td class="available">✔ Yes</td>
        <td class="available">✔ Yes</td>
        </tr>

        <tr>
        <td>Dark Mode</td>
        <td class="available">✔ Yes</td>
        <td class="not-available">✖ No</td>
        </tr>

        <tr>
        <td>Cloud Backup</td>
        <td class="available">✔ Yes</td>
        <td class="available">✔ Yes</td>
        </tr>

        <tr>
        <td>24/7 Support</td>
        <td class="not-available">✖ No</td>
        <td class="available">✔ Yes</td>
        </tr>

        <tr>
        <td>Free Updates</td>
        <td class="available">✔ Yes</td>
        <td class="not-available">✖ No</td>
        </tr>

        </table>

        </section>

        <footer>

            <p>&copy; 2025 Feature Comparison Table | All Rights Reserved.</p>

        </footer>

    </div>
</body>
</html>
