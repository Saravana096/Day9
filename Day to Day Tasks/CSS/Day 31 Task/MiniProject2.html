<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Landing Page</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f2f2f2;
        }

        .container{
            width:90%;
            max-width:1000px;
            margin:30px auto;
        }

        /* Header */

        header{
            background:orangered;
            color:white;
            text-align:center;
            padding:35px;
        }

        header h1{
            margin-bottom:10px;
        }

        /* Feature Section */

        .feature{
            background:white;
            border:2px solid #ddd;
            margin-top:15px;
            padding:40px;
            text-align:center;
            box-sizing:border-box;
            box-shadow:0 4px 10px rgba(0,0,0,0.2);
        }

        .feature img{
            width:90px;
            height:90px;
            border-radius:50%;
            border:2px solid green;
            margin-bottom:20px;
        }

        .feature h2{
            color:#222;
            margin-bottom:15px;
        }

        .feature p{
            color:#666;
            line-height:1.6;
        }

        /* Footer */

        footer{
            background:black;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:15px;
        }
    </style>
</head>
<body>
    <div class="container">

    <header>

        <h1>Welcome to Our Landing Page</h1>

        <p>Discover amazing features and services.</p>

    </header>


    <section class="feature">

        <img src="logo.png" alt="Logo">

        <h2>Why Choose Us?</h2>

        <p>
            We provide high-quality services to help you grow your business.
            Our team focuses on innovation, quality, and customer satisfaction.
        </p>

    </section>


    <footer>

        <p>&copy; 2025 Vetri Technology Solutions. All Rights Reserved.</p>

    </footer>

</div>
</body>
</html>
