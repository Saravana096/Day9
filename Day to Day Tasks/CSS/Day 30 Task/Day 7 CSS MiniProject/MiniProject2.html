<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Login Form</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
            background:linear-gradient(to right,#4facfe,#43e97b);
        }

        .login-box{
            width:350px;
            background:white;
            padding:30px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,0.3);

            display:flex;
            flex-direction:column;
            gap:20px;
        }

        .login-box h2{
            text-align:center;
        }

        .login-box input{
            padding:12px;
            font-size:16px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        .login-box button{
            padding:12px;
            font-size:16px;
            background:#4a90e2;
            color:white;
            border:none;
            border-radius:5px;
            cursor:pointer;
        }

        .login-box button:hover{
            background:#2f6fc0;
        }
    </style>
</head>
<body>
    <div class="login-box">

        <h2>Login</h2>

        <input type="text" placeholder="Username">

        <input type="password" placeholder="Password">

        <button>Login</button>

    </div>
</body>
</html>
