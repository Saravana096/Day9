<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Contact Section</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {

            font-family: Arial, sans-serif;

            background-color: #f1f5f9;

            min-height: 100vh;

            padding: 50px 20px;
        }


        .contact-container {

            max-width: 1000px;

            margin: auto;

            display: flex;

            gap: 30px;

            padding: 30px;

            background-color: white;

            border: 1px solid #d1d5db;

            border-radius: 12px;

            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        }



        .map-section,
        .form-section {

            flex: 1;

            padding: 25px;

            border: 1px solid #d1d5db;

            border-radius: 10px;
        }


   

        .map-section {

            background-color: #e0f2fe;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            min-height: 450px;
        }


        .map-section h2 {

            color: #075985;

            margin-bottom: 20px;
        }


    

        .map {

            width: 100%;

            height: 300px;

            background-color: #bae6fd;

            border: 2px solid #0284c7;

            border-radius: 8px;

            display: flex;

            justify-content: center;

            align-items: center;

            color: #075985;

            font-size: 22px;

            font-weight: bold;
        }


   

        .form-section {

            background-color: #f8fafc;
        }


        .form-section h2 {

            color: #1e293b;

            margin-bottom: 25px;
        }


        

        .form-group {

            margin-bottom: 18px;
        }


        .form-group label {

            display: block;

            margin-bottom: 7px;

            color: #334155;

            font-weight: bold;
        }


    

        .form-group input,
        .form-group textarea {

            width: 100%;

            padding: 12px;

            border: 1px solid #cbd5e1;

            border-radius: 6px;

            font-size: 15px;

            outline: none;
        }


        .form-group textarea {

            height: 120px;

            resize: vertical;
        }


     

        .form-group input:focus,
        .form-group textarea:focus {

            border-color: #2563eb;
        }


    

        .submit-button {

            width: 100%;

            padding: 12px;

            border: none;

            border-radius: 6px;

            background-color: #2563eb;

            color: white;

            font-size: 16px;

            cursor: pointer;

            transition: 0.3s;
        }



        .submit-button:hover {

            background-color: #1d4ed8;

            transform: translateY(-2px);
        }


       

        @media (max-width: 768px) {

            .contact-container {

                flex-direction: column;

                padding: 20px;
            }


            .map-section {

                min-height: 350px;
            }

        }

    </style>

</head>


<body>


    
    <section class="contact-container">


       

        <div class="map-section">

            <h2>
                Find Us
            </h2>


            <div class="map">

                📍 Our Location

            </div>

        </div>



        <div class="form-section">

            <h2>
                Contact Us
            </h2>


            <form>


           

                <div class="form-group">

                    <label for="name">
                        Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your name"
                    >

                </div>


            

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                    >

                </div>



                <div class="form-group">

                    <label for="phone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Enter your phone number"
                    >

                </div>


          

                <div class="form-group">

                    <label for="message">
                        Message
                    </label>

                    <textarea
                        id="message"
                        placeholder="Write your message"
                    ></textarea>

                </div>


          

                <button
                    type="submit"
                    class="submit-button"
                >
                    Send Message
                </button>


            </form>

        </div>


    </section>


</body>

</html>
