<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
    <style>
        body {
            background-color: #f5f7fa;
        }

        .hero {
            padding: 100px 20px;
            text-align: center;
            background: linear-gradient(to right, #0d6efd, #6610f2);
            color: white;
        }

        .hero h1 {
            font-weight: bold;
            font-size: 45px;
        }

        .registration-info {
            padding: 60px 20px;
        }

        .info-card {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
        }

        .modal-header {
            background-color: #0d6efd;
            color: white;
        }

        .modal-header .btn-close {
            filter: brightness(0) invert(1);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">

        <div class="container">

            <!-- Website Name -->
            <a class="navbar-brand fw-bold" href="#">
                🎓 Student Portal
            </a>

            <!-- Mobile Menu Button -->
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#registrationNavbar"
                aria-controls="registrationNavbar"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>

            </button>

            <!-- Navbar Content -->
            <div class="collapse navbar-collapse" id="registrationNavbar">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link active" href="#">
                            Home
                        </a>
                    </li>

                    <li class="nav-item ms-lg-3 mt-2 mt-lg-0">

                        <!-- Register Button -->
                        <button
                            type="button"
                            class="btn btn-primary"
                            data-bs-toggle="modal"
                            data-bs-target="#registrationModal">

                            Register

                        </button>

                    </li>

                </ul>

            </div>

        </div>

    </nav>


    <!-- ================= HERO ================= -->

    <section class="hero">

        <div class="container">

            <h1>Welcome to Student Portal 🎓</h1>

            <p class="lead">
                Register today and start your learning journey.
            </p>

            <!-- Register Button -->
            <button
                type="button"
                class="btn btn-light btn-lg mt-3"
                data-bs-toggle="modal"
                data-bs-target="#registrationModal">

                Register Now

            </button>

        </div>

    </section>


    <!-- ================= INFORMATION ================= -->

    <section class="registration-info">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-md-8">

                    <div class="info-card text-center">

                        <h2 class="mb-4">
                            Student Registration
                        </h2>

                        <p>
                            Complete your registration form to join our
                            student learning portal.
                        </p>

                        <button
                            type="button"
                            class="btn btn-success"
                            data-bs-toggle="modal"
                            data-bs-target="#registrationModal">

                            Open Registration Form

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </section>


    <!-- ================= REGISTRATION MODAL ================= -->

    <div
        class="modal fade"
        id="registrationModal"
        tabindex="-1"
        aria-labelledby="registrationModalLabel"
        aria-hidden="true">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">


                <!-- Modal Header -->

                <div class="modal-header">

                    <h5
                        class="modal-title"
                        id="registrationModalLabel">

                        Student Registration Form

                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close">
                    </button>

                </div>


                <!-- Modal Body -->

                <div class="modal-body">

                    <form>


                        <!-- Student Name -->

                        <div class="mb-3">

                            <label
                                for="studentName"
                                class="form-label">

                                Student Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="studentName"
                                placeholder="Enter your full name"
                                required>

                        </div>


                        <!-- Email -->

                        <div class="mb-3">

                            <label
                                for="studentEmail"
                                class="form-label">

                                Email

                            </label>

                            <input
                                type="email"
                                class="form-control"
                                id="studentEmail"
                                placeholder="Enter your email"
                                required>

                        </div>


                        <!-- Password -->

                        <div class="mb-3">

                            <label
                                for="studentPassword"
                                class="form-label">

                                Password

                            </label>

                            <input
                                type="password"
                                class="form-control"
                                id="studentPassword"
                                placeholder="Enter your password"
                                required>

                        </div>


                        <!-- Phone Number -->

                        <div class="mb-3">

                            <label
                                for="phoneNumber"
                                class="form-label">

                                Phone Number

                            </label>

                            <input
                                type="tel"
                                class="form-control"
                                id="phoneNumber"
                                placeholder="Enter your phone number"
                                required>

                        </div>


                        <!-- Gender -->

                        <div class="mb-3">

                            <label class="form-label">
                                Gender
                            </label>

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="male"
                                    value="male">

                                <label
                                    class="form-check-label"
                                    for="male">

                                    Male

                                </label>

                            </div>

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="female"
                                    value="female">

                                <label
                                    class="form-check-label"
                                    for="female">

                                    Female

                                </label>

                            </div>

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="radio"
                                    name="gender"
                                    id="other"
                                    value="other">

                                <label
                                    class="form-check-label"
                                    for="other">

                                    Other

                                </label>

                            </div>

                        </div>


                        <!-- Course Dropdown -->

                        <div class="mb-3">

                            <label
                                for="course"
                                class="form-label">

                                Course

                            </label>

                            <select
                                class="form-select"
                                id="course"
                                required>

                                <option selected disabled>
                                    Select your course
                                </option>

                                <option value="computer-science">
                                    Computer Science
                                </option>

                                <option value="information-technology">
                                    Information Technology
                                </option>

                                <option value="data-science">
                                    Data Science
                                </option>

                                <option value="artificial-intelligence">
                                    Artificial Intelligence
                                </option>

                                <option value="web-development">
                                    Web Development
                                </option>

                            </select>

                        </div>


                        <!-- Skills -->

                        <div class="mb-3">

                            <label class="form-label">
                                Skills
                            </label>

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="html"
                                    value="html">

                                <label
                                    class="form-check-label"
                                    for="html">

                                    HTML

                                </label>

                            </div>

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="css"
                                    value="css">

                                <label
                                    class="form-check-label"
                                    for="css">

                                    CSS

                                </label>

                            </div>

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="javascript"
                                    value="javascript">

                                <label
                                    class="form-check-label"
                                    for="javascript">

                                    JavaScript

                                </label>

                            </div>

                            <div class="form-check">

                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="python"
                                    value="python">

                                <label
                                    class="form-check-label"
                                    for="python">

                                    Python

                                </label>

                            </div>

                        </div>


                        <!-- Address -->

                        <div class="mb-3">

                            <label
                                for="address"
                                class="form-label">

                                Address

                            </label>

                            <textarea
                                class="form-control"
                                id="address"
                                rows="4"
                                placeholder="Enter your address"
                                required></textarea>

                        </div>


                    </form>

                </div>


                <!-- Modal Footer -->

                <div class="modal-footer">

                    <!-- Close Button -->

                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">

                        Close

                    </button>

                    <!-- Register Button -->

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Register

                    </button>

                </div>


            </div>

        </div>

    </div>


    <!-- ================= FOOTER ================= -->

    <footer class="bg-dark text-white text-center p-4">

        <p class="mb-0">
            © 2026 Student Portal. All Rights Reserved.
        </p>

    </footer>


    <!-- Bootstrap JavaScript -->

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
